# build.yaml — compile the heat solver ON the remote cluster.
#
# Prerequisite: the stage workflow has already git-cloned the repo to
# $HOME/${{ inputs.remote_dir }}/app/heat after the stage workflow git-clones the repo
# there. This workflow loads the target env_load and runs make, so the
# binary matches the cluster's compiler/MPI/fabric. Replaces the remote half of
# the old build step; every build is now a logged workflow run.
#
#   pw workflows run -i runs/<id>/inputs.json --name <id> runs/<id>/build.yaml
#
# NOTE: authored to the documented schema, not runtime-verified here.

'on':
  execute:
    inputs:
      cluster:
        label: Target cluster
        type: compute-clusters
        optional: false
      remote_dir:
        label: Run-scoped working dir on the cluster
        type: string
        optional: false
      mode:
        label: Build mode (cpu|gpu)
        type: string
        optional: false
      env_load:
        label: Environment setup commands, verbatim, joined with && (module load / source / conda / spack ...)
        type: string
        optional: true

jobs:
  build:
    ssh:
      remoteHost: ${{ inputs.cluster.ip }}
    steps:
      - name: Show toolchain
        run: |
          set -euo pipefail
          cd "$HOME/${{ inputs.remote_dir }}/app/heat"
          { ${{ inputs.env_load }} ; } 2>/dev/null || true
          echo "== toolchain on $(hostname) =="
          which mpicc || { echo "mpicc not found after env_load" >&2; exit 2; }
          mpicc --version 2>/dev/null | head -1 || true
      - name: Build the requested mode
        run: |
          set -euo pipefail
          cd "$HOME/${{ inputs.remote_dir }}/app/heat"
          { ${{ inputs.env_load }} ; } 2>/dev/null || true
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "gpu" ]; then
            make gpu && echo "BUILD_OK mode=gpu binary=heat_gpu"
          elif [ "$MODE" = "cpu" ]; then
            make cpu && echo "BUILD_OK mode=cpu binary=heat"
          else
            echo "build: invalid mode '$MODE' (want cpu|gpu)" >&2; exit 2
          fi
