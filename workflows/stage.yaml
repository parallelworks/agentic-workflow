# stage.yaml — deliver the solver source to the cluster by GIT CLONE.
#
# Clones the (public) repository into the run-scoped working dir on the cluster
# and checks out the exact commit the agent is running from, so the cluster runs
# precisely that code. This delivers heat.c, Makefile, validate.py, AND the
# reference field together — no scp, no SSH keys. Replaces the old scp staging.
#
#   pw workflows run -i runs/<id>/stage.inputs.json --name <id>-stage runs/<id>/stage.yaml
#
# The agent autodetects repo_url (git remote get-url origin) and commit
# (git rev-parse HEAD). Both are workflow inputs; the user may override.
#
# NOTE: authored to the documented schema, not runtime-verified here.

'on':
  execute:
    inputs:
      cluster:
        label: Target cluster
        type: compute-clusters
        optional: false
      remote_dir:
        label: Run-scoped working dir on the cluster (clone destination)
        type: string
        optional: false
      repo_url:
        label: Public git URL to clone (autodetected; user may override)
        type: string
        optional: false
      commit:
        label: Commit SHA to check out (autodetected; user may override)
        type: string
        optional: false

jobs:
  stage:
    ssh:
      remoteHost: ${{ inputs.cluster.ip }}
    steps:
      - name: Clone repo and checkout commit
        run: |
          set -euo pipefail
          DEST="${{ inputs.remote_dir }}"
          URL="${{ inputs.repo_url }}"
          SHA="${{ inputs.commit }}"

          # Fresh clone into the run-scoped dir. Fail loudly if it already exists
          # (each run id is unique, so a collision means something is wrong).
          if [ -e "$DEST" ]; then
            echo "stage: destination $DEST already exists on cluster" >&2
            exit 2
          fi
          mkdir -p "$(dirname "$DEST")"
          git clone "$URL" "$DEST"
          cd "$DEST"
          git checkout "$SHA"

          echo "STAGED url=$URL commit=$(git rev-parse HEAD) dest=$DEST"
          echo "== delivered files =="
          ls -1 app/heat/heat.c app/heat/Makefile app/heat/validate.py \
                 app/heat/reference/heat_128.ref
