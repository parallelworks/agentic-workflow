# run.yaml — stage + build + submit, as one atomic workflow.
#
# These three steps make sense together — clone the repo, compile it,
# submit the job — all in the same SSH session and working directory, so merging
# them removes the cross-invocation state problem entirely (no "will the next
# run find what the last one built?"). Each step prints a clear phase marker
# (=== STAGE ===, === BUILD ===, === SUBMIT ===) so a failure is easy to localize
# in the log despite being one run.
#
#   pw workflows run -i runs/<id>/run.inputs.json --name <id> runs/<id>/run.yaml
#
# The agent autodetects repo_url (git remote get-url origin) and commit
# (git rev-parse HEAD); both are inputs the user may override. Directives arrive
# base64-encoded (a single safe token); the solver runs exactly mpi_ranks ranks.

'on':
  execute:
    inputs:
      cluster:
        label: Target cluster
        type: compute-clusters
        optional: false
      remote_dir:
        label: Run-scoped working dir on the cluster (relative to $HOME)
        type: string
        optional: false
      repo_url:
        label: Public git URL to clone (autodetected; user may override)
        type: string
        optional: false
      commit:
        label: Commit SHA to check out (autodetected; user may override)
        type: string
        optional: false
      scheduler:
        label: Scheduler (slurm|pbs)
        type: string
        optional: false
      mode:
        label: Run mode (cpu|gpu)
        type: string
        optional: false
      mpi_ranks:
        label: MPI ranks (explicit; not derived from allocation)
        type: string
        optional: false
      grid:
        label: Global grid size N (NxN)
        type: string
        optional: false
      tol:
        label: Convergence tolerance
        type: string
        optional: false
      max_iter:
        label: Max iterations
        type: string
        optional: false
      mpi_launch:
        label: MPI launch command (e.g. srun --mpi=pmix, mpirun)
        type: string
        optional: false
      env_load:
        label: Environment setup commands, verbatim, joined with && (module load / source / conda / spack ...)
        type: string
        optional: true
      directives_b64:
        label: Verbatim scheduler directives block, base64-encoded
        type: string
        optional: false

jobs:
  run:
    ssh:
      remoteHost: ${{ inputs.cluster.ip }}
    steps:
      - name: Stage — git clone and checkout commit
        run: |
          set -euo pipefail
          echo "=== STAGE ==="
          DEST="$HOME/${{ inputs.remote_dir }}"
          URL="${{ inputs.repo_url }}"
          SHA="${{ inputs.commit }}"
          if [ -e "$DEST" ]; then
            echo "stage: destination $DEST already exists on cluster" >&2
            exit 2
          fi
          mkdir -p "$(dirname "$DEST")"
          git clone "$URL" "$DEST"
          cd "$DEST"
          git checkout "$SHA"
          echo "STAGED url=$URL commit=$(git rev-parse HEAD) dest=$DEST"
          ls -1 app/heat/heat.c app/heat/Makefile app/heat/validate.py \
                 app/heat/reference/heat_128.ref

      - name: Build — compile the requested mode
        run: |
          set -euo pipefail
          echo "=== BUILD ==="
          cd "$HOME/${{ inputs.remote_dir }}/app/heat"
          { ${{ inputs.env_load }} ; } 2>/dev/null || true
          echo "toolchain on $(hostname):"
          which mpicc || { echo "mpicc not found after env_load" >&2; exit 2; }
          mpicc --version 2>/dev/null | head -1 || true
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "gpu" ]; then
            make gpu && echo "BUILD_OK mode=gpu binary=heat_gpu"
          elif [ "$MODE" = "cpu" ]; then
            make cpu && echo "BUILD_OK mode=cpu binary=heat"
          else
            echo "build: invalid mode '$MODE' (want cpu|gpu)" >&2; exit 2
          fi

      - name: Submit — render job script and submit
        run: |
          set -euo pipefail
          echo "=== SUBMIT ==="
          cd "$HOME/${{ inputs.remote_dir }}/app/heat"
          SCHED="${{ inputs.scheduler }}"
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "gpu" ]; then BIN=./heat_gpu; GPU_FLAG=--gpu; else BIN=./heat; GPU_FLAG=""; fi
          mkdir -p out

          # The directives block is injected verbatim (base64-decoded); the tool
          # never parses it. Only output/error redirection and the solver
          # invocation are added.
          if [ "$SCHED" = "slurm" ]; then
            SCRIPT=job.sbatch
            {
              echo '#!/bin/bash'
              echo "${{ inputs.directives_b64 }}" | base64 -d
              echo ""
              echo "#SBATCH --output=out/heat_%j.out"
              echo "#SBATCH --error=out/heat_%j.err"
              echo 'set -euo pipefail'
              echo '{ ${{ inputs.env_load }} ; } 2>/dev/null || true'
              echo "${{ inputs.mpi_launch }} $BIN --grid ${{ inputs.grid }} --tol ${{ inputs.tol }} --max-iter ${{ inputs.max_iter }} $GPU_FLAG --dump out/field_\${SLURM_JOB_ID}.txt"
            } > "$SCRIPT"
            echo "== rendered $SCRIPT =="; cat "$SCRIPT"
            JOBID="$(sbatch "$SCRIPT" | tr -dc '0-9')"
          elif [ "$SCHED" = "pbs" ]; then
            SCRIPT=job.pbs
            {
              echo '#!/bin/bash'
              echo "${{ inputs.directives_b64 }}" | base64 -d
              echo ""
              echo "#PBS -o out/heat.out"
              echo "#PBS -e out/heat.err"
              echo 'set -euo pipefail'
              echo '{ ${{ inputs.env_load }} ; } 2>/dev/null || true'
              echo "${{ inputs.mpi_launch }} -np ${{ inputs.mpi_ranks }} $BIN --grid ${{ inputs.grid }} --tol ${{ inputs.tol }} --max-iter ${{ inputs.max_iter }} $GPU_FLAG --dump out/field_\${PBS_JOBID}.txt"
            } > "$SCRIPT"
            echo "== rendered $SCRIPT =="; cat "$SCRIPT"
            JOBID="$(qsub "$SCRIPT" | tr -dc '0-9.')"
          else
            echo "submit: unknown scheduler '$SCHED'" >&2; exit 2
          fi

          echo "SUBMITTED scheduler=$SCHED job_id=$JOBID remote_dir=$HOME/${{ inputs.remote_dir }}"
          echo "$JOBID" > out/job_id.txt
